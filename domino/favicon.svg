<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Domino tile background -->
  <rect width="100" height="100" fill="#f5f5f5" rx="8"/>
  <rect width="100" height="100" fill="none" stroke="#333" stroke-width="2" rx="8"/>
  
  <!-- Center divider line -->
  <line x1="50" y1="10" x2="50" y2="90" stroke="#333" stroke-width="2"/>
  
  <!-- Top half - 4 dots (2x2 pattern) -->
  <circle cx="30" cy="25" r="4" fill="#333"/>
  <circle cx="70" cy="25" r="4" fill="#333"/>
  <circle cx="30" cy="45" r="4" fill="#333"/>
  <circle cx="70" cy="45" r="4" fill="#333"/>
  
  <!-- Bottom half - 6 dots (3x2 pattern) -->
  <circle cx="25" cy="65" r="4" fill="#333"/>
  <circle cx="50" cy="65" r="4" fill="#333"/>
  <circle cx="75" cy="65" r="4" fill="#333"/>
  <circle cx="25" cy="85" r="4" fill="#333"/>
  <circle cx="50" cy="85" r="4" fill="#333"/>
  <circle cx="75" cy="85" r="4" fill="#333"/>
</svg>